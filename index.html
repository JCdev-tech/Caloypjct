<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>John Carlo Cruzada </title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .profile-card { 
      background: #fff;
      width: 500px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .profile-card img {
      width: 100%;
      height: 350px;
      object-fit: cover;
    }

    .profile-content {
      padding: 20px;
    }

    h2 {
      margin: 0;
      font-size: 24px;
    }

    .role {
      color: #555;
      margin-top: 4px;
      font-size: 14px;
    }

    .info {
      margin: 15px 0;
      font-size: 14px;
      color: #444;
      line-height: 1.5;
    }

    .contact a {
      text-decoration: none;
      color: #0077ff;
      font-size: 14px;
    }

    .skills {
      margin-top: 15px;
    }

    .skill-item {
      background: #eee;
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-block;
      margin: 5px 5px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="mypfp.jpg" width="120px" height="100px" alt="profile Photo" />

    <div class="profile-content">
      <h2>John Carlo Cruzada</h2>
      <div class="role">Aspiring Web Developer</div>

      <div class="info">
        Age: 22 <br>
        Hobby: Reading <br>
        BS Information Technology Student <br>
        Manila, Philippines <br>
        Quotes: Don't stop when you are Tired, Stop when you are Done.
      </div>

      <div class="contact">
        📧 Email: <a href="mailto:juan@example.com">johncarlocruzada130@gmail.com</a><br>
        🔗 GitHub: <a href="#">https://github.com/JCdev-tech</a>
      </div>

      <div class="skills">
        <strong>Skills:</strong><br>
        <span class="skill-item">HTML</span>
        <span class="skill-item">CSS</span>
        <span class="skill-item">JavaScript</span>
        <span class="skill-item">UI Design</span>
      </div>
    </div>
  </div>

</body>
</html>
